[project]
name = "nprompter"
version = "4.4.3"
description = "A web based teleprompter that uses Notion as a storage backend"
authors = [
    { name = "Antonio Feregrino", email = "antonio.feregrino@gmail.com" }
]
license = "MIT"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "python-slugify>=8.0.4",
    "requests>=2.32.5",
    "typer>=0.19.2",
]

[project.scripts]
nprompter = "nprompter.__main__:app"

[dependency-groups]
dev = [
    "beautifulsoup4>=4.14.2",
    "bump-my-version>=1.2.0",
    "cairosvg>=2.9.0",
    "commitizen>=4.9.1",
    "mkdocs-material>=9.6.21",
    "myst-parser>=4.0.1",
    "pillow>=12.3.0",
    "pyproject-flake8>=7.0.0",
    "pytest>=8.4.2",
    "ruff>=0.13.0",
]

[tool.flake8]
max-line-length = 120
per-file-ignores = []
exclude = [".venv", ".content", "dist"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".content",
    ".eggs",
    ".git",
    ".venv",
    "dist",
]

[tool.ruff.format]
[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
default-section = "third-party"
known-first-party = ["nprompter"]
combine-as-imports = true

[tool.bumpversion]
current_version = "4.4.3"
commit = true
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "nprompter/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[tool.uv.build-backend]
module-root = "."
module-name = "nprompter"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[build-system]
requires = ["uv_build>=0.8.6,<0.9.0"]
build-backend = "uv_build"
