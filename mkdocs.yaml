site_name: nprompter
site_url: https://fferegrino.github.io/nprompter/
repo_url: https://github.com/fferegrino/nprompter
repo_name: fferegrino/nprompter

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections

nav:
  - Home: index.md
  - Configuring Notion:
      - Create a database: configuring-notion/create-database.md
      - Create an integration: configuring-notion/create-integration.md
  - Using nprompter:
      - CLI Usage: nprompter/usage.md
      - Keyboard & Remote Controls: nprompter/controls.md
      - Notion Formatting & Cues: nprompter/notion-formatting.md
      - Configuration File: nprompter/configuration-file.md
      - Multi-Database Support: nprompter/multi-database-support.md
      - DIY Teleprompter Setup: nprompter/create-teleprompter.md
      - Alternatives: nprompter/alternatives.md
